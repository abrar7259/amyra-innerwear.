<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Isra Function Hall, Patel Colony, Misbah Nagar, Gulbarga. Check free dates and book online for weddings, walima, engagements and family functions.">
<style>[hidden]{display:none!important}img{max-width:100%}html{-webkit-text-size-adjust:100%}</style>
<title>Isra Function Hall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: arch-framed hero, live availability calendar as the centrepiece, request form beside it, private owner register below */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#10231f; --muted:#56706a; --line:#d9e3e0;
  --brand:#0e6b58; --brand-ink:#ffffff; --brand-soft:#dcefe9; --gold:#a87a22;
  --free:#e3f4ec; --free-ink:#11603f; --half:#fdf0d5; --half-ink:#8a5a00; --full:#fbe1e5; --full-ink:#a3243b;
  --display:"Marcellus", Georgia, serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1715; --surface:#13221f; --ink:#e7f1ee; --muted:#9db5ae; --line:#243934;
  --brand:#4fc3a1; --brand-ink:#08201a; --brand-soft:#173a32; --gold:#e0b45c;
  --free:#143529; --free-ink:#7fe0b2; --half:#3a2e12; --half-ink:#f3c76a; --full:#401c24; --full-ink:#ff9aac; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1715; --surface:#13221f; --ink:#e7f1ee; --muted:#9db5ae; --line:#243934;
  --brand:#4fc3a1; --brand-ink:#08201a; --brand-soft:#173a32; --gold:#e0b45c;
  --free:#143529; --free-ink:#7fe0b2; --half:#3a2e12; --half-ink:#f3c76a; --full:#401c24; --full-ink:#ff9aac; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25rem}
.bar nav{margin-left:auto;display:flex;gap:16px;align-items:center}
.bar nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px}
@media (max-width:640px){.bar nav a{display:none}}

.hero{padding-block:36px 20px}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);margin-top:6px}
.hero p{color:var(--muted);max-width:50ch;margin:12px 0 20px;font-size:1.05rem}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px}
.arch{max-width:100%;justify-self:center}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.86rem}
@media (max-width:780px){.hero .wrap{grid-template-columns:1fr}.arch{display:none}}

section.block{padding-block:28px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{font-size:clamp(1.7rem,3.6vw,2.4rem)}
.sub{color:var(--muted);margin:4px 0 0}

.book{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.book{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-top h3{font-size:1.4rem}
.nav-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.nav-btn:disabled{opacity:.35;cursor:default}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--free);color:var(--free-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0;position:relative}
.day small{font-size:.58rem;font-weight:600;line-height:1}
.day.half{background:var(--half);color:var(--half-ink)}
.day.full{background:var(--full);color:var(--full-ink);cursor:not-allowed}
.day.past{background:transparent;color:var(--muted);opacity:.45;cursor:default}
.day.blank{visibility:hidden}
.day.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.day.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:.88rem;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.status{border-radius:10px;padding:9px 12px;font-size:.9rem;font-weight:600}
.status.ok{background:var(--free);color:var(--free-ink)}
.status.bad{background:var(--full);color:var(--full-ink)}
.status.warn{background:var(--half);color:var(--half-ink)}
.out{background:var(--brand-soft);border-radius:14px;padding:14px;display:grid;gap:10px}
.out pre{white-space:pre-wrap;margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--surface);padding:10px;border-radius:8px;max-height:220px;overflow:auto}
.out .acts{display:flex;gap:8px;flex-wrap:wrap}
.out .acts > *{flex:1}
.note{font-size:.83rem;color:var(--muted);margin:0}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat h3{font-size:1.15rem;margin-bottom:4px}
.feat p{margin:0;color:var(--muted);font-size:.93rem}
@media (max-width:780px){.features{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.features{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.slot{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.slot b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem}
.slot span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.slots{grid-template-columns:1fr}}

.visit{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.visit dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.visit dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.visit dd{margin:0;font-weight:500;min-width:0}
.visit a{color:var(--brand);font-weight:700}
@media (max-width:700px){.visit{grid-template-columns:1fr}.visit dl{grid-template-columns:1fr;gap:2px}.visit dd{margin-bottom:8px}}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}

/* owner register */
.owner{background:var(--surface);border-block:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--bg);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
.ogrid{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.ogrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.list{display:grid;gap:10px;margin-top:12px}
.entry{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface)}
.date-chip{background:var(--brand-soft);border-radius:10px;text-align:center;padding:6px 4px;align-self:start}
.date-chip b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1}
.date-chip span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.entry h4{margin:0;font-size:1rem}
.entry .meta{color:var(--muted);font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;margin-right:4px}
.pill.paid{background:var(--free);color:var(--free-ink)}
.pill.due{background:var(--half);color:var(--half-ink)}
.pill.slot{background:var(--brand-soft);color:var(--ink)}
.entry .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.danger{background:var(--full);color:var(--full-ink)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script id="booked" type="application/json">[]</script>
<script id="main">
const SRC = document.currentScript.textContent;
const CFG = {
  name: "Isra Function Hall",
  wa: "917259783363",
  phoneShow: "+91 72597 83363",
  address: "Patel Colony, Misbah Nagar, Kalaburagi (Gulbarga), Karnataka",
  maps: "https://www.google.com/maps/search/?api=1&query=Isra+Function+Hall+Patel+Colony+Misbah+Nagar+Gulbarga"
};
const SLOTS = { morning: "Morning (8 am – 3 pm)", evening: "Evening (5 pm – 12 am)", full: "Full day (8 am – 12 am)" };
const SHORT = { morning: "AM", evening: "PM", full: "Full" };
const EVENTS = ["Wedding / Nikah","Walima","Engagement","Reception","Mehendi / Haldi","Birthday","Aqiqah","Meeting / Conference","Other"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let BOOKED = [];
try { BOOKED = JSON.parse(document.getElementById("booked").textContent || "[]"); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = keyOf(today);
const rupee = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const nice = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-IN", {weekday:"short", day:"numeric", month:"short", year:"numeric"}); };

function statusOf(list, k) {
  const s = { morning: false, evening: false };
  list.forEach(b => { if (b.d === k) { if (b.s === "full") { s.morning = s.evening = true; } else s[b.s] = true; } });
  return s;
}
const clash = (st, slot) => slot === "full" ? (st.morning || st.evening) : st[slot];

/* ---------- markup ---------- */
$("#app").innerHTML = `
<header class="bar"><div class="wrap">
  <div class="brand"><svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M2 33V15C2 7 8 2 15 2s13 5 13 13v18z" fill="var(--brand)"/><path d="M9 33V18c0-4 3-7 6-7s6 3 6 7v15z" fill="var(--surface)"/></svg>${esc(CFG.name)}</div>
  <nav><a href="#availability">Availability</a><a href="#hall">The hall</a><a href="#visit">Visit</a><a class="btn sm" href="#availability">Book a date</a></nav>
</div></header>

<section class="hero"><div class="wrap">
  <div>
    <div class="eyebrow">Misbah Nagar · Gulbarga</div>
    <h1>Your celebration, under one roof.</h1>
    <p>Weddings, walima, engagements and family functions at Isra Function Hall, Patel Colony. Check free dates below and send your booking request in a minute, from anywhere.</p>
    <div class="actions"><a class="btn" href="#availability">Check free dates</a><a class="btn ghost" href="#visit">Get directions</a></div>
    <div class="facts"><span class="fact">Morning &amp; evening slots</span><span class="fact">Dining hall</span><span class="fact">Parking</span><span class="fact">Power backup</span></div>
  </div>
  <svg class="arch" width="320" height="300" viewBox="0 0 320 300" aria-hidden="true">
    <path d="M20 300V140C20 62 83 10 160 10s140 52 140 130v160z" fill="var(--brand)"/>
    <path d="M50 300V150c0-62 49-108 110-108s110 46 110 108v150z" fill="var(--brand-soft)"/>
    <path d="M95 300V180c0-38 29-68 65-68s65 30 65 68v120z" fill="var(--surface)"/>
    <g fill="var(--gold)"><circle cx="160" cy="62" r="5"/><circle cx="110" cy="80" r="3.5"/><circle cx="210" cy="80" r="3.5"/><circle cx="78" cy="118" r="2.5"/><circle cx="242" cy="118" r="2.5"/></g>
    <path d="M160 140l8 14-8 14-8-14z" fill="var(--gold)"/>
    <rect x="70" y="282" width="180" height="18" fill="var(--gold)" opacity=".35"/>
  </svg>
</div></section>

<section class="block" id="availability"><div class="wrap">
  <div class="head"><div><h2>Availability &amp; booking</h2><p class="sub">Green dates are free. Tap a date to start your request.</p></div></div>
  <div class="book">
    <div class="panel">
      <div class="cal-top"><button class="nav-btn" id="prev" aria-label="Previous month">‹</button><h3 id="monthName"></h3><button class="nav-btn" id="next" aria-label="Next month">›</button></div>
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="days" id="days" style="margin-top:6px"></div>
      <div class="legend"><span><i style="background:var(--free)"></i>Free</span><span><i style="background:var(--half)"></i>One slot left</span><span><i style="background:var(--full)"></i>Fully booked</span></div>
    </div>
    <div class="panel">
      <h3 style="font-size:1.4rem;margin-bottom:12px">Request a booking</h3>
      <form id="reqForm" novalidate>
        <div class="row2">
          <label for="rDate">Date<input type="date" id="rDate" min="${TODAY}" required></label>
          <label for="rSlot">Slot<select id="rSlot">${Object.entries(SLOTS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        </div>
        <div id="rStatus" class="status" hidden></div>
        <label for="rEvent">Function<select id="rEvent">${EVENTS.map(e => `<option>${e}</option>`).join("")}</select></label>
        <div class="row2">
          <label for="rName">Your name<input id="rName" autocomplete="name" required></label>
          <label for="rPhone">Mobile<input id="rPhone" inputmode="tel" autocomplete="tel" placeholder="10-digit number" required></label>
        </div>
        <label for="rGuests">Approx. guests<input id="rGuests" inputmode="numeric" placeholder="e.g. 300"></label>
        <label for="rNotes">Anything else?<textarea id="rNotes" rows="2" placeholder="Catering, decoration, stage…"></textarea></label>
        <p class="status bad" id="rErr" hidden></p>
        <button class="btn" type="submit">Send request on WhatsApp</button>
        <p class="note">Your date is confirmed once the hall replies and the advance is paid.</p>
      </form>
      <div class="out" id="rOut" hidden style="margin-top:12px">
        <strong>Your request is ready to send</strong>
        <pre id="rMsg"></pre>
        <div class="acts"><a class="btn" id="rWa" href="#" target="_blank" rel="noopener">Open WhatsApp</a><button class="btn ghost" id="rCopy" type="button">Copy message</button></div>
        <p class="note">If WhatsApp doesn't open, copy the message and send it to ${esc(CFG.phoneShow)}.</p>
      </div>
    </div>
  </div>
</div></section>

<section class="block" id="hall"><div class="wrap">
  <div class="head"><div><h2>The hall</h2><p class="sub">Everything a family function needs, in the heart of Misbah Nagar.</p></div></div>
  <div class="features">
    <div class="feat"><h3>Main hall</h3><p>Spacious seating hall with a decorated stage for nikah, reception and engagement.</p></div>
    <div class="feat"><h3>Dining area</h3><p>Separate dining space with a cooking area for your caterer.</p></div>
    <div class="feat"><h3>Separate seating</h3><p>Arrangements for separate ladies' and gents' seating on request.</p></div>
    <div class="feat"><h3>Parking</h3><p>Parking space for guests' cars and two-wheelers.</p></div>
    <div class="feat"><h3>Power backup</h3><p>Generator backup so lights and fans keep running.</p></div>
    <div class="feat"><h3>Bride's room</h3><p>A private room for the bride and family to get ready.</p></div>
  </div>
  <div class="slots">
    <div class="slot"><b>Morning</b><span>8:00 am – 3:00 pm</span></div>
    <div class="slot"><b>Evening</b><span>5:00 pm – 12:00 am</span></div>
    <div class="slot"><b>Full day</b><span>8:00 am – 12:00 am</span></div>
  </div>
</div></section>

<section class="block" id="visit"><div class="wrap">
  <div class="panel visit">
    <div><h2 style="font-size:1.8rem;margin-bottom:12px">Visit the hall</h2>
      <dl><dt>Address</dt><dd>${esc(CFG.name)}, ${esc(CFG.address)}<br><a href="${CFG.maps}" target="_blank" rel="noopener">Open in Google Maps ↗</a></dd>
      <dt>Call / WhatsApp</dt><dd>${esc(CFG.phoneShow)}</dd>
      <dt>Hall visits</dt><dd>Every day, 10 am – 8 pm</dd></dl>
    </div>
    <div><h3 style="font-size:1.3rem;margin-bottom:8px">How booking works</h3>
      <ol style="margin:0;padding-left:20px;color:var(--muted);display:grid;gap:6px">
        <li>Pick a free date and slot on the calendar.</li>
        <li>Send your request on WhatsApp.</li>
        <li>We call you back to confirm rent and details.</li>
        <li>Pay the advance and the date is yours.</li>
      </ol>
    </div>
  </div>
</div></section>

<section class="block owner" id="owner" hidden><div class="wrap">
  <div class="head"><div><h2>Booking register</h2><p class="sub" id="oSub">Only the hall owner sees this. Saving a booking also marks the date on the public calendar.</p></div>
    <button class="btn ghost sm" id="oClose" type="button">Close register</button></div>
  <div id="oBody"></div>
</div></section>

<footer><div class="wrap"><span>© ${today.getFullYear()} ${esc(CFG.name)} · Patel Colony, Misbah Nagar, Gulbarga</span><button class="linkbtn" id="ownerLink" type="button">Owner register</button></div></footer>
<div class="toast" id="toast" hidden></div>`;

/* ---------- public calendar ---------- */
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = "";
function renderCal() {
  $("#monthName").textContent = MONTHS[view.getMonth()] + " " + view.getFullYear();
  $("#prev").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
  const first = view.getDay(), n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  let h = "";
  for (let i = 0; i < first; i++) h += `<span class="day blank"></span>`;
  for (let d = 1; d <= n; d++) {
    const k = keyOf(new Date(view.getFullYear(), view.getMonth(), d));
    const st = statusOf(BOOKED, k);
    let cls = "day", lbl = "free", small = "";
    if (k < TODAY) { cls += " past"; lbl = "past"; }
    else if (st.morning && st.evening) { cls += " full"; lbl = "fully booked"; small = "Booked"; }
    else if (st.morning) { cls += " half"; lbl = "evening free"; small = "PM free"; }
    else if (st.evening) { cls += " half"; lbl = "morning free"; small = "AM free"; }
    if (k === TODAY) cls += " today";
    if (k === selected) cls += " sel";
    h += `<button class="${cls}" data-k="${k}" aria-label="${nice(k)}, ${lbl}" ${k < TODAY ? "disabled" : ""}>${d}${small ? `<small>${small}</small>` : ""}</button>`;
  }
  $("#days").innerHTML = h;
}
$("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); };
$("#next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); };
$("#days").onclick = e => {
  const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
  const st = statusOf(BOOKED, b.dataset.k);
  if (st.morning && st.evening) { toast("That date is fully booked. Please pick another."); return; }
  selected = b.dataset.k; $("#rDate").value = selected;
  $("#rSlot").value = st.morning ? "evening" : st.evening ? "morning" : $("#rSlot").value;
  renderCal(); checkReq(); $("#rName").focus({preventScroll:true});
  if (innerWidth < 860) $("#reqForm").scrollIntoView({behavior:"smooth", block:"start"});
};

function checkReq() {
  const k = $("#rDate").value, s = $("#rSlot").value, box = $("#rStatus");
  if (!k) { box.hidden = true; return true; }
  if (k < TODAY) { box.className = "status bad"; box.textContent = "Please choose today or a future date."; box.hidden = false; return false; }
  const st = statusOf(BOOKED, k);
  if (clash(st, s)) {
    box.className = "status bad";
    box.textContent = st.morning && st.evening ? `${nice(k)} is fully booked.` : `${SLOTS[s]} is taken on ${nice(k)}. The ${st.morning ? "evening" : "morning"} slot is free.`;
    box.hidden = false; return false;
  }
  box.className = "status ok"; box.textContent = `${nice(k)} · ${SLOTS[s]} is available.`; box.hidden = false; return true;
}
$("#rDate").onchange = () => { selected = $("#rDate").value; if (selected) { const [y,m] = selected.split("-").map(Number); view = new Date(y, m-1, 1); } renderCal(); checkReq(); };
$("#rSlot").onchange = checkReq;

$("#reqForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#rName").value.trim(), phone = $("#rPhone").value.replace(/\D/g, ""), k = $("#rDate").value, err = $("#rErr");
  if (!k || !name || phone.length < 10) { err.textContent = "Please choose a date and fill in your name and 10-digit mobile number."; err.hidden = false; return; }
  if (!checkReq()) { err.textContent = "That slot is already booked. Please pick a free date or slot."; err.hidden = false; return; }
  err.hidden = true;
  const g = $("#rGuests").value.trim(), notes = $("#rNotes").value.trim();
  const msg = `Assalamu Alaikum, I want to book ${CFG.name}.\n\nDate: ${nice(k)}\nSlot: ${SLOTS[$("#rSlot").value]}\nFunction: ${$("#rEvent").value}` + (g ? `\nGuests: about ${g}` : "") + `\n\nName: ${name}\nMobile: ${phone}` + (notes ? `\nNotes: ${notes}` : "");
  $("#rMsg").textContent = msg;
  $("#rWa").href = `https://wa.me/${CFG.wa}?text=${encodeURIComponent(msg)}`;
  $("#rOut").hidden = false; $("#rOut").scrollIntoView({behavior:"smooth", block:"nearest"});
});
$("#rCopy").onclick = () => copyText($("#rMsg"), $("#rCopy"));
function copyText(el, btn) {
  const done = () => btn.textContent = "Copied";
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected – press copy"; };
  try { navigator.clipboard.writeText(el.textContent).then(done, sel); } catch (e) { sel(); }
}
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3500); }

renderCal();

/* ---------- owner register (private, db) ---------- */
let db = null, user = null, art = null, canEdit = false, ready = false;
let register = [], unsub = null, loadTimer = null, loaded = false, tab = "upcoming", q = "", editing = null, delArm = null;

(async () => {
  if (!window.claude || !claude.use) { ready = true; return; }
  try { [user, db, art] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("artifact")]); } catch (e) {}
  try { canEdit = user ? await user.canEdit() : false; } catch (e) {}
  ready = true;
  let reopen = false; try { reopen = sessionStorage.getItem("isra-owner") === "1"; sessionStorage.removeItem("isra-owner"); } catch (e) {}
  if (reopen && canEdit && db) openOwner();
})();

$("#ownerLink").onclick = () => { location.href = "https://claude.ai/artifact/VLfXkcPFLjuHjx83zzgDoy#owner"; };
$("#oClose").onclick = () => { $("#owner").hidden = true; };

function openOwner() {
  $("#owner").hidden = false;
  if (!ready) { $("#oBody").innerHTML = `<p class="empty">Checking your access…</p>`; setTimeout(openOwner, 600); return; }
  if (!canEdit || !db) {
    $("#oBody").innerHTML = `<p class="empty">The register is private. Only the hall owner can open it, signed in to claude.ai with the account this page was shared with as an editor.</p>`;
    $("#owner").scrollIntoView({behavior:"smooth"}); return;
  }
  renderOwnerShell(); $("#owner").scrollIntoView({behavior:"smooth"});
  if (!unsub) {
    loadTimer = setTimeout(() => { if (!loaded) { $("#oList").innerHTML = `<p class="empty">The register can't be reached right now. Check your internet and keep this page open.</p>`; } }, 10000);
    unsub = db.collection("bookings").orderBy("date").onSnapshot(snap => {
      register = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(loadTimer); }
      renderList();
    }, err => { clearTimeout(loadTimer); $("#oList").innerHTML = `<p class="empty">The register stopped loading (${esc(err.code)}). Reload the page to try again.</p>`; });
  }
}

function renderOwnerShell() {
  $("#oBody").innerHTML = `
  <div class="stats"><div class="stat"><b id="sUp">0</b><span>Upcoming bookings</span></div><div class="stat"><b id="sMonth">0</b><span>This month</span></div><div class="stat"><b id="sDue">₹0</b><span>Balance still to collect</span></div></div>
  <div class="ogrid">
    <div class="panel" style="background:var(--bg)">
      <h3 id="fTitle" style="font-size:1.3rem;margin-bottom:10px">Add a booking</h3>
      <form id="oForm" novalidate>
        <div class="row2"><label for="oDate">Date<input type="date" id="oDate" required></label>
          <label for="oSlot">Slot<select id="oSlot">${Object.entries(SLOTS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></label></div>
        <label for="oEvent">Function<select id="oEvent">${EVENTS.map(e => `<option>${e}</option>`).join("")}</select></label>
        <div class="row2"><label for="oName">Customer name<input id="oName" required></label>
          <label for="oPhone">Mobile<input id="oPhone" inputmode="tel"></label></div>
        <div class="row2"><label for="oTotal">Total rent (₹)<input id="oTotal" inputmode="numeric"></label>
          <label for="oAdv">Advance paid (₹)<input id="oAdv" inputmode="numeric"></label></div>
        <label for="oGuests">Guests<input id="oGuests" inputmode="numeric"></label>
        <label for="oNotes">Notes<textarea id="oNotes" rows="2" placeholder="Caterer, decoration, reference…"></textarea></label>
        <p class="status bad" id="oErr" hidden></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" id="oSave" style="flex:1">Save booking</button><button class="btn ghost" type="button" id="oCancel" hidden>Cancel edit</button></div>
        <p class="note">Saving also blocks this date and slot on the public calendar.</p>
      </form>
    </div>
    <div style="min-width:0">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
        <div class="tabs" role="group" aria-label="Show bookings"><button data-t="upcoming">Upcoming</button><button data-t="past">Past</button><button data-t="all">All</button></div>
        <input id="oSearch" placeholder="Search name, phone, function" style="max-width:260px">
      </div>
      <div class="list" id="oList"><p class="empty">Loading the register…</p></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn ghost sm" id="oSync" type="button">Refresh public calendar</button></div>
    </div>
  </div>`;
  document.querySelectorAll(".tabs button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderList(); }; });
  $("#oSearch").oninput = e => { q = e.target.value.trim().toLowerCase(); renderList(); };
  $("#oForm").addEventListener("submit", saveBooking);
  $("#oCancel").onclick = () => fillForm(null);
  $("#oSync").onclick = () => publishCalendar(register.map(b => ({ d: b.date, s: b.slot })), "Public calendar refreshed.");
  $("#oList").onclick = listClick;
  renderList();
}

function renderList() {
  if (!$("#oList")) return;
  const up = register.filter(b => b.date >= TODAY);
  const ym = TODAY.slice(0, 7);
  $("#sUp").textContent = up.length;
  $("#sMonth").textContent = register.filter(b => (b.date || "").startsWith(ym)).length;
  $("#sDue").textContent = rupee(up.reduce((a, b) => a + Math.max(0, (+b.total || 0) - (+b.advance || 0)), 0));
  let rows = tab === "upcoming" ? up : tab === "past" ? register.filter(b => b.date < TODAY).reverse() : register;
  if (q) rows = rows.filter(b => [b.name, b.phone, b.event, b.notes].join(" ").toLowerCase().includes(q));
  if (!loaded && !register.length) return;
  if (!rows.length) { $("#oList").innerHTML = `<p class="empty">${register.length ? "No bookings match." : "No bookings yet. Add the first one with the form."}</p>`; return; }
  $("#oList").innerHTML = rows.map(b => {
    const [y, m, d] = (b.date || "").split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const bal = Math.max(0, (+b.total || 0) - (+b.advance || 0));
    return `<article class="entry"><div class="date-chip"><span>${MONTHS[m-1]?.slice(0,3) || ""}</span><b>${d || "?"}</b><span>${dt.toLocaleDateString("en-IN",{weekday:"short"})}</span></div>
      <div style="min-width:0"><h4>${esc(b.name)} · ${esc(b.event)}</h4>
        <div class="meta"><span class="pill slot">${esc(SHORT[b.slot] || b.slot)}</span>${b.total ? (bal ? `<span class="pill due">${rupee(bal)} due</span>` : `<span class="pill paid">Paid</span>`) : ""} ${esc(nice(b.date))}</div>
        <div class="meta">${b.phone ? "📞 " + esc(b.phone) + " · " : ""}${b.total ? "Rent " + rupee(b.total) + " · Advance " + rupee(b.advance) : "Rent not entered"}${b.guests ? " · " + esc(b.guests) + " guests" : ""}</div>
        ${b.notes ? `<div class="meta">${esc(b.notes)}</div>` : ""}
        <div class="acts"><button class="btn ghost sm" data-edit="${esc(b.id)}">Edit</button><button class="btn sm danger" data-del="${esc(b.id)}">Delete</button></div>
      </div></article>`;
  }).join("");
}

function fillForm(b) {
  editing = b ? b.id : null;
  $("#fTitle").textContent = b ? "Edit booking" : "Add a booking";
  $("#oSave").textContent = b ? "Save changes" : "Save booking";
  $("#oCancel").hidden = !b;
  $("#oDate").value = b?.date || ""; $("#oSlot").value = b?.slot || "morning"; $("#oEvent").value = b?.event || EVENTS[0];
  $("#oName").value = b?.name || ""; $("#oPhone").value = b?.phone || ""; $("#oTotal").value = b?.total || "";
  $("#oAdv").value = b?.advance || ""; $("#oGuests").value = b?.guests || ""; $("#oNotes").value = b?.notes || "";
  $("#oErr").hidden = true;
  if (b) $("#oForm").scrollIntoView({behavior:"smooth", block:"center"});
}

function listClick(e) {
  const ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
  if (ed) fillForm(register.find(b => b.id === ed.dataset.edit));
  if (del) {
    const id = del.dataset.del;
    if (delArm !== id) { delArm = id; del.textContent = "Tap again to delete"; setTimeout(() => { if (delArm === id) { delArm = null; renderList(); } }, 3500); return; }
    delArm = null; del.disabled = true;
    db.collection("bookings").doc(id).delete().then(() => {
      publishCalendar(register.filter(b => b.id !== id).map(b => ({ d: b.date, s: b.slot })), "Booking deleted. Date is free again on the calendar.");
    }, err => toast("Couldn't delete (" + err.code + "). Try again."));
  }
}

async function saveBooking(e) {
  e.preventDefault();
  const err = $("#oErr");
  const b = { date: $("#oDate").value, slot: $("#oSlot").value, event: $("#oEvent").value, name: $("#oName").value.trim(),
    phone: $("#oPhone").value.trim(), total: Number($("#oTotal").value.replace(/\D/g, "")) || 0, advance: Number($("#oAdv").value.replace(/\D/g, "")) || 0,
    guests: $("#oGuests").value.trim(), notes: $("#oNotes").value.trim() };
  if (!b.date || !b.name) { err.textContent = "Enter the date and the customer's name."; err.hidden = false; return; }
  const others = register.filter(x => x.id !== editing).map(x => ({ d: x.date, s: x.slot }));
  if (clash(statusOf(others, b.date), b.slot)) {
    const who = register.find(x => x.id !== editing && x.date === b.date && (x.slot === b.slot || x.slot === "full" || b.slot === "full"));
    err.textContent = `This slot is already booked${who ? " by " + who.name + " (" + who.event + ")" : ""}. Choose another date or slot.`; err.hidden = false; return;
  }
  err.hidden = true; $("#oSave").disabled = true; $("#oSave").textContent = "Saving…";
  const ref = editing ? db.collection("bookings").doc(editing) : db.collection("bookings").doc();
  try { await ref.set(b); }
  catch (x) { $("#oSave").disabled = false; $("#oSave").textContent = "Save booking"; err.textContent = x.code === "quota_exceeded" ? "The register is full." : "Couldn't save (" + x.code + "). Check your internet and try again."; err.hidden = false; return; }
  const list = others.concat([{ d: b.date, s: b.slot }]);
  publishCalendar(list, editing ? "Booking updated." : "Booking saved and date blocked on the calendar.");
}

function buildPage(list) {
  const keep = list.filter(x => x.d && x.d >= TODAY).sort((a, c) => a.d < c.d ? -1 : 1);
  const json = JSON.stringify(keep).replace(/</g, "\\u003c");
  const css = document.getElementById("css").textContent;
  const S = "script", E = "</" + S + ">";
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>`
    + `<title>Isra Function Hall</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">\n<style id="css">${css}</style>\n<div id="app"></div>\n<${S} id="booked" type="application/json">${json}${E}\n<${S} id="main">${SRC}${E}`
    + `</body></html>`;
}

async function publishCalendar(list, okMsg) {
  if (!art) { toast("Saved in the register. The public calendar can't be updated from this view."); resetSave(); return; }
  try { sessionStorage.setItem("isra-owner", "1"); sessionStorage.setItem("isra-msg", okMsg); } catch (e) {}
  try { await art.publish(buildPage(list)); }
  catch (x) {
    try { sessionStorage.removeItem("isra-owner"); sessionStorage.removeItem("isra-msg"); } catch (e) {}
    if (x.code === "conflict") return;
    toast("Saved in the register, but the public calendar didn't update (" + x.code + "). Tap “Refresh public calendar”.");
    resetSave();
  }
}
function resetSave() { if ($("#oSave")) { $("#oSave").disabled = false; fillForm(null); } }
try { const m = sessionStorage.getItem("isra-msg"); if (m) { sessionStorage.removeItem("isra-msg"); setTimeout(() => toast(m), 400); } } catch (e) {}
</script>

<script>
fetch("bookings.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(l=>{if(Array.isArray(l)){BOOKED=l;renderCal();checkReq();}}).catch(()=>{});
</script>
</body>
</html>
